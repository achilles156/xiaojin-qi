###########################################################
# Xiaojin Qi — personal site (Beautiful Jekyll)
###########################################################

title: Xiaojin Qi
author: Xiaojin Qi

navbar-links:
  Home: "index.html"
  Research: "research"
  Teaching: "teaching"
  Writing: "writing"

avatar: "/assets/img/avatar-icon.png"
round-avatar: true

social-network-links:
  github: achilles156

rss-description: Research notes on landscape and classical Chinese texts

url: "https://achilles156.github.io"
baseurl: "/xiaojin-qi"

share-links-active:
  twitter: false
  facebook: false
  linkedin: false

title-on-all-pages: true
edit_page_button: false
post_search: false

page-col: "#FFFFFF"
text-col: "#404040"
link-col: "#008AFF"
hover-col: "#0085A1"
navbar-col: "#EAEAEA"
navbar-text-col: "#404040"
navbar-border-col: "#DDDDDD"
footer-col: "#EAEAEA"
footer-text-col: "#777777"
footer-link-col: "#404040"
footer-hover-col: "#0085A1"

timezone: "America/Los_Angeles"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/

kramdown:
  input: GFM

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: false
  -
    scope:
      path: ""
    values:
      layout: "page"

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

remote_theme: daattali/beautiful-jekyll@v6.0.1
